[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsent"
version = "0.1.0"
description = "Entanglement structure of energy-predicting transformers (tensor-network arm)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "scikit-learn", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
